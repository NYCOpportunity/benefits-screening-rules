name: Deploy Lambda Function

on:
  push:
    branches: [ prod, stg ]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - stg
          - prod
      dry_run:
        description: Build package only (skip AWS deploy)
        required: false
        type: boolean
        default: true

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME_PROD: benefits-screening-rules-prd
  LAMBDA_FUNCTION_NAME_STG: benefits-screening-rules-stg

permissions:
  contents: read
  id-token: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/prod') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install production dependencies
      run: uv sync --no-dev

    - name: Configure AWS credentials
      if: github.event_name == 'push' || inputs.dry_run == false
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Create deployment package
      run: |
        mkdir -p package
        uv export --no-dev --format requirements-txt > requirements.txt
        pip install -r requirements.txt -t package/
        cp -r src package/
        cd package
        zip -r ../lambda-deployment.zip . -x "*.pyc" "*__pycache__*" "*.git*" "*.github*" "tests/*" "test_*"
        cd ..

    - name: Deploy to Production Lambda
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_PROD }} \
          --zip-file fileb://lambda-deployment.zip

    - name: Wait for code update
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda wait function-updated \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_PROD }}

    - name: Update Production Lambda configuration
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda update-function-configuration \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_PROD }} \
          --handler src.main.main \
          --environment Variables="{
            ENVIRONMENT=production,
            LOG_LEVEL=INFO
          }" \
          --timeout 30 \
          --memory-size 512 \
          --runtime python3.13

    - name: Wait for configuration update
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda wait function-updated \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_PROD }}

  deploy-staging:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/stg') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'stg')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install production dependencies
      run: uv sync --no-dev

    - name: Configure AWS credentials
      if: github.event_name == 'push' || inputs.dry_run == false
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Create deployment package
      run: |
        mkdir -p package
        uv export --no-dev --format requirements-txt > requirements.txt
        pip install -r requirements.txt -t package/
        cp -r src package/
        cd package
        zip -r ../lambda-deployment.zip . -x "*.pyc" "*__pycache__*" "*.git*" "*.github*" "tests/*" "test_*"
        cd ..

    - name: Deploy to Staging Lambda
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_STG }} \
          --zip-file fileb://lambda-deployment.zip

    - name: Wait for code update
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda wait function-updated \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_STG }}

    - name: Update Staging Lambda configuration
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda update-function-configuration \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_STG }} \
          --handler src.main.main \
          --environment Variables="{
            ENVIRONMENT=staging,
            LOG_LEVEL=DEBUG
          }" \
          --timeout 60 \
          --memory-size 256 \
          --runtime python3.13

    - name: Wait for configuration update
      if: github.event_name == 'push' || inputs.dry_run == false
      run: |
        aws lambda wait function-updated \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_STG }}
